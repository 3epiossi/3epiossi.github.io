<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 誰會贏？</title>
  <meta name="description" content="誰會贏？互動規則學院：透過 8 道精選盤面題目，清晰易懂地掌握單向行棋、生子轉彎、直線吃子、受阻PASS特權與自然終局勢力填滿等正式規則。">

  <style>
    :root {
      --cell: clamp(34px, 5.6vw, 52px);
      --coord: 22px;
      --accent: #38bdf8;
      --bg: #0b1329;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --gold: #facc15;
      --purple: #c084fc;
      --navy: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: #f8fafc;
      min-height: 100vh;
      user-select: none;
    }

    .app {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Navigation Bar */
    .topNav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 20px;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .brandTitle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }

    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-weight: 700;
    }

    .navActions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Buttons */
    button {
      border-radius: 10px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.32);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: rgba(147, 197, 253, 0.4);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    button.green {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border-color: rgba(134, 239, 172, 0.4);
      color: white;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
    }

    button.purple {
      background: linear-gradient(135deg, #9333ea, #7e22ce);
      border-color: rgba(216, 180, 254, 0.4);
      color: white;
      box-shadow: 0 4px 14px rgba(147, 51, 234, 0.35);
    }

    button.amber {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: rgba(253, 224, 71, 0.4);
      color: white;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);
    }

    button.warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #1e1b4b;
      font-weight: 800;
    }

    /* Main Tutorial Grid Layout */
    .tutorialLayout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .tutorialLayout {
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }

    /* Board Container Style identical to index.html */
    .boardArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    /* Turn status banner above board — matches game's statusBanner style */
    .tutorialStatusBanner {
      width: 100%;
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 10px;
      transition: all 0.25s ease;
    }

    .tutorialStatusBanner.black {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.4), rgba(15, 23, 42, 0.7));
      border: 1px solid rgba(59, 130, 246, 0.5);
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
    }

    .tutorialStatusBanner.white {
      background: linear-gradient(135deg, rgba(120, 53, 15, 0.4), rgba(15, 23, 42, 0.7));
      border: 1px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.15);
    }

    .tutorialTurnDot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tutorialTurnDot.black {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .tutorialTurnDot.white {
      background: #facc15;
      box-shadow: 0 0 8px #facc15;
    }

    .boardWrap {
      position: relative;
      display: inline-block;
      padding: 14px;
      padding-right: 148px; /* Reserved space for sideDiceWidget */
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.9));
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .boardFrame {
      position: relative;
      display: inline-block;
      padding-top: var(--coord);
      padding-left: var(--coord);
    }

    .coordTop {
      position: absolute;
      top: 0;
      left: var(--coord);
      display: grid;
      grid-template-columns: repeat(8, var(--cell));
      column-gap: 3px;
      padding-left: 6px;
      height: var(--coord);
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .coordLeft {
      position: absolute;
      top: var(--coord);
      left: 0;
      display: grid;
      grid-template-rows: repeat(8, var(--cell));
      row-gap: 3px;
      padding-top: 6px;
      width: var(--coord);
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-weight: 700;
      font-size: 13px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, var(--cell));
      grid-template-rows: repeat(8, var(--cell));
      gap: 3px;
      background: #113621;
      padding: 6px;
      border-radius: 14px;
      border: 2px solid #1e4a30;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 2px 8px rgba(255, 255, 255, 0.05);
    }

    .cell {
      background: #166534;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      cursor: pointer;
      aspect-ratio: 1;
      transition: background 0.15s ease, transform 0.1s ease;
      z-index: 1;
    }

    .cell:hover {
      background: #15803d;
    }

    /* Pieces (Discs) matching index.html */
    .disc {
      width: calc(var(--cell) * 0.82);
      height: calc(var(--cell) * 0.82);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.2);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }

    .disc.black {
      background: radial-gradient(circle at 35% 30%, #475569 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .disc.white {
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #e2e8f0 60%, #cbd5e1 100%);
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    /* Interactive state on board */
    .cell.can-act .disc {
      box-shadow: 0 0 0 2px #facc15, 0 4px 10px rgba(250, 204, 21, 0.4);
    }

    .cell.selected {
      background: rgba(250, 204, 21, 0.25) !important;
    }

    .cell.selected .disc {
      transform: scale(1.08);
      box-shadow: 0 0 0 3px #facc15, 0 6px 14px rgba(250, 204, 21, 0.6);
    }

    /* Spawn target */
    .cell.dest-spawn {
      cursor: pointer;
      background: rgba(34, 197, 94, 0.28) !important;
    }

    .cell.dest-spawn::after {
      content: "";
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Capture target */
    .cell.dest-capture {
      cursor: pointer !important;
      background: rgba(239, 68, 68, 0.35) !important;
    }

    .cell.dest-capture::after {
      content: "⚔️";
      font-size: 15px;
      position: absolute;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
    }

    .cell.filled-territory {
      animation: fadeInFilled 0.8s ease forwards;
    }

    @keyframes fadeInFilled {
      from { opacity: 0.3; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .cell.hint-highlight {
      box-shadow: inset 0 0 0 2px #facc15, 0 0 12px rgba(250, 204, 21, 0.5) !important;
    }

    /* SVG Path Overlay matching index.html */
    .pathOverlay, .pathOverlay * {
      pointer-events: none !important;
    }

    .pathOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 7;
      overflow: visible;
    }

    @keyframes dash-move {
      to {
        stroke-dashoffset: -20;
      }
    }

    .animated-path-dash {
      animation: dash-move 1.2s linear infinite;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }

    .pulse-start-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-ring 1.8s ease-in-out infinite;
    }

    .pulse-end-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-ring 1.5s ease-in-out infinite;
    }

    .path-waypoint-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      pointer-events: none;
    }

    .path-dest-badge {
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.6));
    }

    /* Prominent Side Dice Widget right beside board */
    .sideDiceWidget {
      position: absolute;
      top: var(--coord);
      left: calc(100% + 14px);
      width: 110px;
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.9));
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .boardWrap {
        padding-right: 12px !important;
      }

      .sideDiceWidget {
        position: static;
        flex-direction: row;
        width: 100%;
        max-width: 380px;
        justify-content: space-around;
        gap: 12px;
        margin-top: 14px;
      }

      .sideDiceValBadge {
        width: auto !important;
      }
    }

    .diceBox {
      width: 64px;
      height: 64px;
      background: linear-gradient(145deg, #f8fafc, #e2e8f0);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 -2px 5px rgba(0, 0, 0, 0.12), inset 0 2px 4px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .pipGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 48px;
      height: 48px;
      align-items: center;
      justify-items: center;
    }

    .diceValText, .diceQuestionMark {
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: #94a3b8;
    }

    .pipDot {
      width: 8px;
      height: 8px;
      background: #0f172a;
      border-radius: 50%;
      margin: auto;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .pipDot.red {
      background: #dc2626;
      box-shadow: inset 0 1px 2px rgba(153, 27, 27, 0.9);
    }

    .sideDiceValBadge {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      white-space: nowrap;
    }

    /* Right Panel: Rule Mission Card */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .puzzleHeaderBox {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      gap: 10px;
    }

    .puzzleCategoryTag {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .puzzleTitle {
      font-size: 20px;
      font-weight: 800;
      color: #f8fafc;
      margin: 0;
    }

    .puzzleGoalBox {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-left: 4px solid #38bdf8;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14.5px;
      line-height: 1.6;
      color: #f1f5f9;
    }

    .feedbackBox {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.55;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .feedbackBox.success {
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #86efac;
      display: block;
    }

    .feedbackBox.warning {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde047;
      display: block;
    }

    /* Official Rule Document Card */
    .ruleDocCard {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .ruleDocHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: #c084fc;
      margin-bottom: 8px;
    }

    .ruleDocContent {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      margin: 0;
    }

    /* Puzzle Quick Index Navigation Grid */
    .puzzleNavGrid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    .puzzleNavBtn {
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .puzzleNavBtn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }

    .puzzleNavBtn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .puzzleNavBtn.solved::after {
      content: "✓";
      font-size: 11px;
      color: #22c55e;
      font-weight: bold;
    }

    .bottomControls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .langSwitcher { display: inline-flex; gap: 3px; align-items: center; }
    .langBtn { padding: 4px 9px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #94a3b8; transition: all 0.15s; }
    .langBtn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    .langBtn:hover:not(.active) { background: rgba(255,255,255,0.15); color: #f8fafc; }
  </style>
</head>

<body>
  <div class="app">
    <!-- Top Navigation Bar -->
    <header class="topNav">
      <div class="langSwitcher">
        <button class="langBtn" data-lang="zh" onclick="setLang('zh')">中</button>
        <button class="langBtn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="langBtn" data-lang="ja" onclick="setLang('ja')">日</button>
      </div>
      <div class="brandTitle">
        <span id="brandTitleText">🎓 誰會贏？</span>
        <span class="badge" id="badgeText">官方規則學院</span>
      </div>
      <div class="navActions">
        <span id="puzzleProgressText" style="font-size: 13px; color: #94a3b8; font-weight: 600;">已完成 0 / 8 規則</span>
        <a href="index.html" style="text-decoration: none;">
          <button class="primary" id="backToGameBtn">🎮 返回遊戲對弈</button>
        </a>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="tutorialLayout">
      <!-- Left: Board Area -->
      <section class="boardArea">
        <!-- Turn Status Banner -->
        <div id="tutorialStatusBanner" class="tutorialStatusBanner black" aria-live="polite">
          <span id="tutorialTurnDot" class="tutorialTurnDot black"></span>
          <span id="tutorialTurnText">⚫ 黑棋回合</span>
        </div>
        <div class="boardWrap">
          <div class="boardFrame">
            <div class="coordTop" aria-hidden="true">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span>
            </div>
            <div class="coordLeft" aria-hidden="true">
              <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
            </div>
            <div class="board" id="tutorialBoard">
              <!-- SVG Path Overlay -->
              <svg id="tutorialPathOverlay" class="pathOverlay" aria-hidden="true">
                <defs>
                  <!-- Black Markers (Navy Blue for both spawn and capture) -->
                  <marker id="arrow-black-spawn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb" />
                  </marker>
                  <marker id="arrow-black-capture" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb" />
                  </marker>

                  <!-- White Markers (Golden Amber for both spawn and capture) -->
                  <marker id="arrow-white-spawn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M 0 1 L 7 4 L 0 7 z" fill="#f59e0b" />
                  </marker>
                  <marker id="arrow-white-capture" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M 0 1 L 7 4 L 0 7 z" fill="#f59e0b" />
                  </marker>

                  <!-- Glow Filters -->
                  <filter id="glow-black-spawn" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#1d4ed8" flood-opacity="0.85" />
                  </filter>
                  <filter id="glow-black-capture" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#1d4ed8" flood-opacity="0.85" />
                  </filter>
                  <filter id="glow-white-spawn" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#f59e0b" flood-opacity="0.9" />

    // ===== 盤面操作與勢力填滿演算法 =====
    function cloneBoard(b) {
      return b.map(row => [...row]);

    // ===== 終局勢力填滿演算法（依照規則一與規則二） =====
    function fillTerritoryRule1Rule2(b, firstTurn) {
      const result = cloneBoard(b);

      // 黑棋最短步數傳播 (只能往左 c-1、往上 r-1)
      const distB = Array.from({ length: N }, () => Array(N).fill(Infinity));
      const qB = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (result[r][c] === BLACK) {
            distB[r][c] = 0;
            qB.push({ r, c, d: 0 });
          }
        }
      }
      while (qB.length > 0) {
        const { r, c, d } = qB.shift();
        for (const [dr, dc] of [[-1, 0], [0, -1]]) {
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc) && result[nr][nc] !== WHITE) {
            if (d + 1 < distB[nr][nc]) {
              distB[nr][nc] = d + 1;
              qB.push({ r: nr, c: nc, d: d + 1 });
            }
          }
        }
      }

      // 白棋最短步數傳播 (只能往右 c+1、往下 r+1)
      const distW = Array.from({ length: N }, () => Array(N).fill(Infinity));
      const qW = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (result[r][c] === WHITE) {
            distW[r][c] = 0;
            qW.push({ r, c, d: 0 });
          }
        }
      }
      while (qW.length > 0) {
        const { r, c, d } = qW.shift();
        for (const [dr, dc] of [[1, 0], [0, 1]]) {
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc) && result[nr][nc] !== BLACK) {
            if (d + 1 < distW[nr][nc]) {
              distW[nr][nc] = d + 1;
              qW.push({ r: nr, c: nc, d: d + 1 });
            }
          }
        }
      }

      const newlyFilled = new Set();
      let filledCount = 0;
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (result[r][c] === EMPTY) {
            const dB = distB[r][c];
            const dW = distW[r][c];
            if (dB < Infinity && dW === Infinity) {
              result[r][c] = BLACK;
              newlyFilled.add(`${r},${c}`);
              filledCount++;
            } else if (dW < Infinity && dB === Infinity) {
              result[r][c] = WHITE;
              newlyFilled.add(`${r},${c}`);
              filledCount++;
            } else if (dB < Infinity && dW < Infinity) {
              if (dB < dW) result[r][c] = BLACK;
              else if (dW < dB) result[r][c] = WHITE;
              else result[r][c] = firstTurn;
              newlyFilled.add(`${r},${c}`);
              filledCount++;
            }
          }
        }
      }

      return { filledBoard: result, filledCount, newlyFilled };
    }

    // ===== 坐標中心計算 =====
    function inBounds(r, c) {
      return r >= 0 && r < N && c >= 0 && c < N;
    }

    function getCellCenter(r, c) {
      const cells = boardEl.querySelectorAll(".cell");
      const idx = r * N + c;
      const cell = cells[idx];
      if (!cell) return { x: 0, y: 0 };
      return {
        x: cell.offsetLeft + cell.offsetWidth / 2,
        y: cell.offsetTop + cell.offsetHeight / 2
      };
    }

    // ===== 合法走法計算（嚴格遵循規則） =====
    function getLegalMovesForPiece(b, r0, c0, player, D) {
      if (!inBounds(r0, c0) || b[r0][c0] !== player || D <= 0) {
        return { spawns: [], captures: [] };
      }

      const enemy = player === BLACK ? WHITE : BLACK;
      const spawns = [];
      const captures = [];

      const stepDirs = player === BLACK
        ? [[0, -1], [-1, 0]] // 黑棋：左、上
        : [[0, 1], [1, 0]];   // 白棋：右、下

      // 1. 生子 (規則二) - 曼哈頓最短路徑
      const visited = new Set();
      const queue = [{ r: r0, c: c0, dist: 0, path: [{ r: r0, c: c0 }] }];
      visited.add(`${r0},${c0},0`);
      const reachableSpawns = new Map();

      while (queue.length > 0) {
        const curr = queue.shift();

        if (curr.dist === D) {
          if (b[curr.r][curr.c] === EMPTY) {
            reachableSpawns.set(`${curr.r},${curr.c}`, {
              r: curr.r,
              c: curr.c,
              path: curr.path
            });
          }
          continue;
        }

        for (const [dr, dc] of stepDirs) {
          const nr = curr.r + dr;
          const nc = curr.c + dc;
          const ndist = curr.dist + 1;

          if (!inBounds(nr, nc)) continue;
          if (b[nr][nc] === enemy) continue; // 敵棋阻隔

          const key = `${nr},${nc},${ndist}`;
          if (!visited.has(key)) {
            visited.add(key);
            queue.push({
              r: nr,
              c: nc,
              dist: ndist,
              path: [...curr.path, { r: nr, c: nc }]
            });
          }
        }
      }

      for (const target of reachableSpawns.values()) {
        spawns.push({
          fromR: r0,
          fromC: c0,
          toR: target.r,
          toC: target.c,
          type: "spawn",
          path: target.path,
          player: player
        });
      }

      // 2. 吃子 (規則三) - 純直線直行
      for (const [dr, dc] of stepDirs) {
        let blocked = false;
        const capturePath = [{ r: r0, c: c0 }];

        for (let step = 1; step < D; step++) {
          const ir = r0 + dr * step;
          const ic = c0 + dc * step;
          if (!inBounds(ir, ic)) { blocked = true; break; }
          if (b[ir][ic] === enemy) { blocked = true; break; }
          capturePath.push({ r: ir, c: ic });
        }

        if (blocked) continue;

        const tr = r0 + dr * D;
        const tc = c0 + dc * D;
        if (inBounds(tr, tc) && b[tr][tc] === enemy) {
          capturePath.push({ r: tr, c: tc });
          captures.push({
            fromR: r0,
            fromC: c0,
            toR: tr,
            toC: tc,
            type: "capture",
            path: capturePath,
            player: player
          });
        }
      }

      return { spawns, captures };
    }

    // ===== 繪製路徑箭頭與步數徽章 =====
    function clearMovePath() {
      if (pathGroup) pathGroup.innerHTML = "";

    function drawMovePath(move) {
      if (!pathGroup) return;
      pathGroup.innerHTML = "";
      if (!move || !move.path || move.path.length < 2) return;

      const p = PUZZLES[currentPuzzleIdx];
      const player = move.player != null 
        ? move.player 
        : (board[move.fromR]?.[move.fromC] || (p ? p.turn : BLACK));
      const isBlack = (player === BLACK);
      const isCapture = move.type === "capture";

      // Theme design configurations:
      // 黑棋：海軍藍 (Navy Blue) - 不論生子或吃子皆同
      // 白棋：曜金香檳 (Golden Amber) - 不論生子或吃子皆同
      let theme;
      if (isBlack) {
        theme = {
          glowColor: "#1e3a8a",
          glowFilter: "url(#glow-black-spawn)",
          lineStroke: "#38bdf8",
          arrowMarker: "url(#arrow-black-spawn)",
          startRing: "rgba(37, 99, 235, 0.35)",
          startBorder: "#2563eb",
          startDot: "#3b82f6",
          waypointBg: "#0b1329",
          waypointBorder: "#2563eb",
          waypointText: "#ffffff",
          destHalo: "rgba(37, 99, 235, 0.3)",
          destHaloBorder: "#2563eb",
          destBg: "#0b1329",
          destBorder: "#3b82f6",
          destText: "#ffffff"
        };
      } else {
        theme = {
          glowColor: "#d97706",
          glowFilter: "url(#glow-white-spawn)",
          lineStroke: "#fde047",
          arrowMarker: "url(#arrow-white-spawn)",
          startRing: "rgba(245, 158, 11, 0.35)",
          startBorder: "#f59e0b",
          startDot: "#fbbf24",
          waypointBg: "#ffffff",
          waypointBorder: "#d97706",
          waypointText: "#78350f",
          destHalo: "rgba(251, 191, 36, 0.35)",
          destHaloBorder: "#f59e0b",
          destBg: "#ffffff",
          destBorder: "#d97706",
          destText: "#78350f"
        };
      }

      const points = move.path.map(pt => getCellCenter(pt.r, pt.c));
      const startPt = points[0];
      const endPt = points[points.length - 1];
      const prevPt = points[points.length - 2];

      const distLast = Math.hypot(endPt.x - prevPt.x, endPt.y - prevPt.y);
      const trimDist = 13.5;
      const ux = distLast > 0 ? (endPt.x - prevPt.x) / distLast : 0;
      const uy = distLast > 0 ? (endPt.y - prevPt.y) / distLast : 0;
      const lineEnd = distLast > trimDist ? { x: endPt.x - ux * trimDist, y: endPt.y - uy * trimDist } : endPt;

      const pathPoints = [...points.slice(0, -1), lineEnd];
      const dStr = pathPoints.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(" ");

      // 1. Glowing backdrop line
      const glowLine = document.createElementNS("http://www.w3.org/2000/svg", "path");
      glowLine.setAttribute("d", dStr);
      glowLine.setAttribute("fill", "none");
      glowLine.setAttribute("stroke", theme.glowColor);
      glowLine.setAttribute("stroke-width", "6.5");
      glowLine.setAttribute("stroke-linecap", "round");
      glowLine.setAttribute("stroke-linejoin", "round");
      glowLine.setAttribute("opacity", "0.5");
      glowLine.setAttribute("filter", theme.glowFilter);
      pathGroup.appendChild(glowLine);

      // 2. Animated dashed foreground path with directional arrow
      const mainLine = document.createElementNS("http://www.w3.org/2000/svg", "path");
      mainLine.setAttribute("d", dStr);
      mainLine.setAttribute("fill", "none");
      mainLine.setAttribute("stroke", theme.lineStroke);
      mainLine.setAttribute("stroke-width", "3.5");
      mainLine.setAttribute("stroke-linecap", "round");
      mainLine.setAttribute("stroke-linejoin", "round");
      mainLine.setAttribute("stroke-dasharray", "6 4");
      mainLine.setAttribute("class", "animated-path-dash");
      mainLine.setAttribute("marker-end", theme.arrowMarker);
      pathGroup.appendChild(mainLine);

      // 3. Start node marker (Origin beacon)
      const startOuter = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      startOuter.setAttribute("cx", startPt.x);
      startOuter.setAttribute("cy", startPt.y);
      startOuter.setAttribute("r", "14");
      startOuter.setAttribute("fill", theme.startRing);
      startOuter.setAttribute("stroke", theme.startBorder);
      startOuter.setAttribute("stroke-width", "1.8");
      startOuter.setAttribute("class", "pulse-start-ring");
      pathGroup.appendChild(startOuter);

      const startInner = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      startInner.setAttribute("cx", startPt.x);
      startInner.setAttribute("cy", startPt.y);
      startInner.setAttribute("r", "4.5");
      startInner.setAttribute("fill", theme.startDot);
      pathGroup.appendChild(startInner);

      // 4. Intermediate step badges (1, 2, ... D-1)
      for (let i = 1; i < points.length - 1; i++) {
        const pt = points[i];
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", pt.x);
        dot.setAttribute("cy", pt.y);
        dot.setAttribute("r", "9.5");
        dot.setAttribute("fill", theme.waypointBg);
        dot.setAttribute("stroke", theme.waypointBorder);
        dot.setAttribute("stroke-width", "1.8");
        pathGroup.appendChild(dot);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", pt.x);
        text.setAttribute("y", pt.y);
        text.setAttribute("dy", "0.35em");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "10");
        text.setAttribute("font-weight", "800");
        text.setAttribute("class", "path-waypoint-text");
        text.setAttribute("fill", theme.waypointText);
        text.textContent = String(i);
        pathGroup.appendChild(text);
      }

      // 5. Destination badge (Step D)
      const totalSteps = points.length - 1;

      const endRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      endRing.setAttribute("cx", endPt.x);
      endRing.setAttribute("cy", endPt.y);
      endRing.setAttribute("r", "17.5");
      endRing.setAttribute("fill", theme.destHalo);
      endRing.setAttribute("stroke", theme.destHaloBorder);
      endRing.setAttribute("stroke-width", "2");
      if (isCapture) {
        endRing.setAttribute("stroke-dasharray", "3 3");
      }
      endRing.setAttribute("class", "pulse-end-ring");
      pathGroup.appendChild(endRing);

      const endBadge = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      endBadge.setAttribute("cx", endPt.x);
      endBadge.setAttribute("cy", endPt.y);
      endBadge.setAttribute("r", "12");
      endBadge.setAttribute("fill", theme.destBg);
      endBadge.setAttribute("stroke", theme.destBorder);
      endBadge.setAttribute("stroke-width", "2.4");
      endBadge.setAttribute("class", "path-dest-badge");
      pathGroup.appendChild(endBadge);

      const endText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      endText.setAttribute("x", endPt.x);
      endText.setAttribute("y", endPt.y);
      endText.setAttribute("dy", "0.35em");
      endText.setAttribute("text-anchor", "middle");
      endText.setAttribute("font-size", "12");
      endText.setAttribute("font-weight", "900");
      endText.setAttribute("class", "path-waypoint-text");
      endText.setAttribute("fill", theme.destText);
      endText.textContent = String(totalSteps);
      pathGroup.appendChild(endText);
    }

    // ===== 棋盤狀態繪製 =====
    function renderBoard() {
      const p = PUZZLES[currentPuzzleIdx];
      const cells = boardEl.querySelectorAll(".cell");

      const spawnDestMap = new Set(legalMovesForSelected.spawns.map(m => `${m.toR},${m.toC}`));
      const captureDestMap = new Set(legalMovesForSelected.captures.map(m => `${m.toR},${m.toC}`));

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const idx = r * N + c;
          const cell = cells[idx];
          const val = board[r][c];

          cell.className = "cell";
          cell.innerHTML = "";

          if (val === BLACK) {
            const disc = document.createElement("div");
            disc.className = "disc black";
            cell.appendChild(disc);
          } else if (val === WHITE) {
            const disc = document.createElement("div");
            disc.className = "disc white";
            cell.appendChild(disc);
          }

          if (val === p.turn) {
            const legals = getLegalMovesForPiece(board, r, c, p.turn, p.dice);
            if (legals.spawns.length > 0 || legals.captures.length > 0) {
              cell.classList.add("can-act");
            }
          }

          if (currentPuzzleIdx === 6 && q7Step === 1 && r === 7 && c === 7) {
            cell.classList.add("hint-highlight");
            cell.classList.add("can-act");
          }
          if (currentPuzzleIdx === 7 && (q8Step === 1 || q8Step === 3 || q8Step === 5) && ((r === 1 && c === 1) || (r === 1 && c === 2))) {
            cell.classList.add("hint-highlight");

          if (currentPuzzleIdx === 7 && q8Step === 6 && ((r === 6 && c === 6) || (r === 6 && c === 7) || (r === 7 && c === 6) || (r === 7 && c === 7))) {
            cell.classList.add("hint-highlight");
            cell.classList.add("can-act");
          }

          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add("selected");
          }

          if (spawnDestMap.has(`${r},${c}`)) {
            cell.classList.add("dest-spawn");
            cell.title = `生子至 ${posToCoord(r, c)}`;
          }

          if (captureDestMap.has(`${r},${c}`)) {
            cell.classList.add("dest-capture");
            cell.title = `直線吃掉 ${posToCoord(r, c)} 的敵棋`;
          }

          if (endgameFilledCells && endgameFilledCells.has(`${r},${c}`)) {
            cell.classList.add("filled-territory");
          }
        }
      }
    }

    // ===== 點擊棋盤格互動處理 =====
    function handleCellClick(r, c) {
      const p = getPuzzle(currentPuzzleIdx);

      // 題目 7：新手教學指示互動處理
      if (currentPuzzleIdx === 6) {
        handleQ7Click(r, c);
        return;
      }

      // 題目 8：新手教學指示互動處理
      if (currentPuzzleIdx === 7) {
        handleQ8Click(r, c);
        return;
      }

      // 1. 點擊己方可動棋子
      if (board[r][c] === p.turn) {
        selectedCell = { r, c };
        legalMovesForSelected = getLegalMovesForPiece(board, r, c, p.turn, p.dice);
        clearMovePath();
        playBeep(440, "sine", 0.08);
        renderBoard();
        return;
      }

      // 2. 若已選中棋子，點選目標格
      if (selectedCell) {
        const foundSpawn = legalMovesForSelected.spawns.find(m => m.toR === r && m.toC === c);
        const foundCapture = legalMovesForSelected.captures.find(m => m.toR === r && m.toC === c);
        const move = foundSpawn || foundCapture;

        if (move) {
          if (move.type === "capture") {
            board[move.fromR][move.fromC] = EMPTY;
            board[move.toR][move.toC] = p.turn;
          } else {
            board[move.toR][move.toC] = p.turn;
          }

          move.player = p.turn;
          lastPuzzleMove = move;
          drawMovePath(move);
          selectedCell = null;
          legalMovesForSelected = { spawns: [], captures: [] };
          renderBoard();

          // 驗證過關
          const isCorrect = p.isTargetSolved(move);
          if (isCorrect) {
            playSuccessSound();
            feedbackBox.className = "feedbackBox success";
            feedbackBox.innerHTML = `<strong>${TUI('successHdr')}</strong><br>${p.successText}`;
            solvedPuzzles.add(p.id);
            saveSolvedProgress();
            updateNavGrid();
            updateProgress();
          } else {
            playBeep(220, "sawtooth", 0.2);
            feedbackBox.className = "feedbackBox warning";
            feedbackBox.innerHTML = `<strong>${TUI('wrongHdr')}</strong><br>${p.hintText}`;
          }
        }
      }
    }

      } catch (e) {}
    }

    function loadSavedProgress() {
      try {
        const saved = localStorage.getItem("dice_othello_rules_solved");
        if (saved) {
          solvedPuzzles = new Set(JSON.parse(saved));
        }
      } catch (e) {}
    }

    clearProgressBtn.addEventListener("click", () => {
      if (confirm("確定要重設所有規則題庫的通關記錄嗎？")) {
        solvedPuzzles.clear();
        try {
          localStorage.removeItem("dice_othello_rules_solved");
        } catch (e) {}
        updateNavGrid();
        updateProgress();
      }
    });

    // ===== 初始化啟動 =====
    loadSavedProgress();
    initBoardDOM();
    applyTutorialI18n();
    const hashIdx = parseInt(window.location.hash.replace("#", ""), 10) - 1;
    const paramIdx = parseInt(new URLSearchParams(window.location.search).get("p"), 10) - 1;
    const startIdx = (!isNaN(hashIdx) && hashIdx >= 0 && hashIdx < PUZZLES.length) ? hashIdx
      : ((!isNaN(paramIdx) && paramIdx >= 0 && paramIdx < PUZZLES.length) ? paramIdx : 0);
    loadPuzzle(startIdx);
  </script>
</body>

</html>
